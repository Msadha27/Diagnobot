<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ding Dong - AI Clinical Assistant</title>
    <meta name="description" content="Smart AI-powered healthcare assistant for patients and doctors.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Background Animated Pattern -->
    <div class="background-grid"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="robot-bg"></div>

    <div class="container">
        <!-- Logo Area -->
        <header class="header">
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M2 17L12 22L22 17" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M2 12L12 17L22 12" stroke="#0070ff" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                <span>DING DONG</span>
            </div>
        </header>

        <!-- Hero Section -->
        <main class="hero">
            <h1 class="main-heading">DING DONG</h1>
            <h2 class="sub-heading">Welcome to AI Clinical Assistant</h2>
            <p class="description">Smart AI-powered healthcare assistant for patients and doctors.</p>

            <!-- Mode Selection Cards -->
            <div class="cards-container">
                <!-- Patient Mode Card -->
                <button id="patient-card" class="mode-card group">
                    <div class="card-glow"></div>
                    <div class="card-content">
                        <div class="icon-container">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                                <circle cx="8.5" cy="8.5" r="1.5" />
                                <polyline points="21 15 16 10 5 21" />
                                <path d="M12 14v4M10 16h4" />
                            </svg>
                        </div>
                        <h3 class="card-title">Patient Mode</h3>
                        <p class="card-desc">Capture symptoms, upload reports, and view history.</p>
                        <div class="btn-primary">
                            <span>Enter as Patient</span>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                                <polyline points="12 5 19 12 12 19"></polyline>
                            </svg>
                        </div>
                    </div>
                </button>

                <!-- Doctor Mode Card -->
                <button id="doctor-card" class="mode-card group">
                    <div class="card-glow doctor-glow"></div>
                    <div class="card-content">
                        <div class="icon-container">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
                                <circle cx="12" cy="12" r="10" stroke-opacity="0.2" />
                            </svg>
                        </div>
                        <h3 class="card-title">Doctor Mode</h3>
                        <p class="card-desc">Analyze reports, manage appointments, and access patient records.</p>
                        <div class="btn-primary">
                            <span>Enter as Doctor</span>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                                <polyline points="12 5 19 12 12 19"></polyline>
                            </svg>
                        </div>
                    </div>
                </button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
