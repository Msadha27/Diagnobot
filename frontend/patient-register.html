<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Registration - DiagnoBot</title>
    <link rel="stylesheet" href="styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <header class="header"><h1>Patient Registration</h1></header>
        <main class="form-section">
            <form id="patient-register-form" class="register-form">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required />
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="" disabled selected>Select gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
                <label for="age">Age</label>
                <input type="number" id="age" name="age" min="0" required />
                <label for="medical_record">Previous Medical Record (optional)</label>
                <textarea id="medical_record" name="medical_record" rows="4"></textarea>
                <button type="submit" class="btn-primary">Register</button>
            </form>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
