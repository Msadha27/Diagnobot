version: "3.9"\n\nservices:\n  # ==================== BACKEND API ====================\n  backend:\n    build:\n      context: .\n      dockerfile: Dockerfile\n    container_name: diagnobot-backend\n    ports:\n      - "8000:8000\"\n    environment:\n      - ENVIRONMENT=development\n      - DATABASE_URL=postgresql://diagnobot:diagnobot@postgres:5432/diagnobot\n      - REDIS_URL=redis://redis:6379/0\n      - LOG_LEVEL=INFO\n      - USE_GPU=false  # Set to true if using GPU\n    volumes:\n      - ./uploads:/app/uploads\n      - ./models_cache:/app/models_cache\n      - ./logs:/app/logs\n    depends_on:\n      - postgres\n      - redis\n    networks:\n      - diagnobot-net\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:8000/health\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n      start_period: 40s\n    restart: unless-stopped\n\n  # ==================== DATABASE ====================\n  postgres:\n    image: postgres:16-alpine\n    container_name: diagnobot-postgres\n    environment:\n      POSTGRES_DB: diagnobot\n      POSTGRES_USER: diagnobot\n      POSTGRES_PASSWORD: diagnobot\n    ports:\n      - \"5432:5432\"\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n    networks:\n      - diagnobot-net\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U diagnobot\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n    restart: unless-stopped\n\n  # ==================== REDIS CACHE ====================\n  redis:\n    image: redis:7-alpine\n    container_name: diagnobot-redis\n    ports:\n      - \"6379:6379\"\n    volumes:\n      - redis_data:/data\n    networks:\n      - diagnobot-net\n    healthcheck:\n      test: [\"CMD\", \"redis-cli\", \"ping\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n    restart: unless-stopped\n\n  # ==================== OPTIONAL: PgAdmin (Database UI) ====================\n  pgadmin:\n    image: dpage/pgadmin4:latest\n    container_name: diagnobot-pgadmin\n    environment:\n      PGADMIN_DEFAULT_EMAIL: admin@diagnobot.local\n      PGADMIN_DEFAULT_PASSWORD: admin\n    ports:\n      - \"5050:80\"\n    networks:\n      - diagnobot-net\n    profiles:\n      - debug  # Only run with: docker-compose --profile debug up\n    restart: unless-stopped\n\nvolumes:\n  postgres_data:\n  redis_data:\n\nnetworks:\n  diagnobot-net:\n    driver: bridge
